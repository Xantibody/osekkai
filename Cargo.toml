[package]
name = "osekkai"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "文章のまとめ方の skill を支えるガードレール。Markdown の構造と読み手のステートを lint する"

[dependencies]
clap = { version = "4", features = ["derive"] }
markdown = "1.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
